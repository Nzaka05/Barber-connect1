<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col relative selection:bg-primary selection:text-on-primary">
<!-- Transactional Header (Nav Shell Suppressed per instructions for checkout flows) -->
<header class="flex items-center justify-between px-container-margin py-stack-md bg-surface border-b border-surface-container-high sticky top-0 z-40">
<button aria-label="Go back" class="text-on-background hover:text-primary transition-colors flex items-center justify-center p-unit -ml-unit rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-background text-center flex-1 pr-6">Book Appointment</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-margin py-stack-lg space-y-stack-lg pb-[120px] max-w-2xl mx-auto w-full">
<!-- 1. Service Summary (Glassmorphism / Tonal Shift Card) -->
<section class="bg-surface-container rounded-xl p-gutter shadow-[0_8px_30px_0_rgba(0,0,0,0.3)] border border-surface-container-highest flex gap-gutter items-center">
<div class="w-20 h-20 rounded-lg overflow-hidden shrink-0 bg-surface-container-low">

</div>
<div class="flex-1">
<h2 class="font-label-sm text-label-sm text-primary uppercase mb-1">Executive Grooming</h2>
<h3 class="font-body-lg text-body-lg text-on-surface font-semibold mb-1">Premium Fade &amp; Beard</h3>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">schedule</span> 45 Min
                </p>
</div>
<div class="text-right">
<p class="font-headline-md text-headline-md text-primary">KES 1,200</p>
</div>
</section>
<!-- 2. Date Selection (Horizontal Calendar) -->
<section class="space-y-stack-md">
<div class="flex items-center justify-between">
<h3 class="font-headline-md text-headline-md text-on-background">Select Date</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase">August</span>
</div>
<div class="flex overflow-x-auto gap-unit pb-2 no-scrollbar -mx-container-margin px-container-margin snap-x">
<!-- Unselected Date -->
<button class="snap-start shrink-0 w-[72px] h-[88px] flex flex-col items-center justify-center rounded-xl border border-outline-variant bg-surface text-on-surface-variant hover:border-outline transition-colors">
<span class="font-label-sm text-label-sm uppercase mb-1">Mon</span>
<span class="font-headline-md text-headline-md">12</span>
</button>
<!-- Selected Date (High Contrast Gold) -->
<button class="snap-start shrink-0 w-[72px] h-[88px] flex flex-col items-center justify-center rounded-xl border border-primary bg-primary-container text-on-primary-container shadow-[0_0_20px_rgba(212,175,55,0.15)] transform scale-105 transition-all">
<span class="font-label-sm text-label-sm uppercase mb-1 font-bold">Tue</span>
<span class="font-headline-md text-headline-md font-bold">13</span>
</button>
<!-- Unselected Date -->
<button class="snap-start shrink-0 w-[72px] h-[88px] flex flex-col items-center justify-center rounded-xl border border-outline-variant bg-surface text-on-surface-variant hover:border-outline transition-colors">
<span class="font-label-sm text-label-sm uppercase mb-1">Wed</span>
<span class="font-headline-md text-headline-md">14</span>
</button>
<button class="snap-start shrink-0 w-[72px] h-[88px] flex flex-col items-center justify-center rounded-xl border border-outline-variant bg-surface text-on-surface-variant hover:border-outline transition-colors">
<span class="font-label-sm text-label-sm uppercase mb-1">Thu</span>
<span class="font-headline-md text-headline-md">15</span>
</button>
<button class="snap-start shrink-0 w-[72px] h-[88px] flex flex-col items-center justify-center rounded-xl border border-outline-variant bg-surface text-on-surface-variant hover:border-outline transition-colors">
<span class="font-label-sm text-label-sm uppercase mb-1">Fri</span>
<span class="font-headline-md text-headline-md">16</span>
</button>
</div>
</section>
<!-- 3. Time Slots (Grid Layout) -->
<section class="space-y-stack-md">
<h3 class="font-headline-md text-headline-md text-on-background">Select Time</h3>
<div class="space-y-gutter">
<!-- Morning Group -->
<div>
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-unit flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">light_mode</span> Morning
                    </h4>
<div class="grid grid-cols-3 gap-unit">
<button class="py-stack-sm rounded-lg border border-outline-variant bg-surface text-on-surface hover:border-outline font-body-md text-body-md transition-colors opacity-50 cursor-not-allowed">
                            09:00 AM
                        </button>
<button class="py-stack-sm rounded-lg border border-outline-variant bg-surface text-on-surface hover:border-outline font-body-md text-body-md transition-colors">
                            10:00 AM
                        </button>
<button class="py-stack-sm rounded-lg border border-outline-variant bg-surface text-on-surface hover:border-outline font-body-md text-body-md transition-colors">
                            11:30 AM
                        </button>
</div>
</div>
<!-- Afternoon Group -->
<div>
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-unit flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">partly_cloudy_day</span> Afternoon
                    </h4>
<div class="grid grid-cols-3 gap-unit">
<button class="py-stack-sm rounded-lg border border-outline-variant bg-surface text-on-surface hover:border-outline font-body-md text-body-md transition-colors">
                            12:30 PM
                        </button>
<!-- Selected Time Slot -->
<button class="py-stack-sm rounded-lg border border-primary bg-primary-container text-on-primary-container font-body-md text-body-md font-bold shadow-[0_0_15px_rgba(212,175,55,0.1)]">
                            02:00 PM
                        </button>
<button class="py-stack-sm rounded-lg border border-outline-variant bg-surface text-on-surface hover:border-outline font-body-md text-body-md transition-colors">
                            03:30 PM
                        </button>
</div>
</div>
<!-- Evening Group -->
<div>
<h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase mb-unit flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">dark_mode</span> Evening
                    </h4>
<div class="grid grid-cols-3 gap-unit">
<button class="py-stack-sm rounded-lg border border-outline-variant bg-surface text-on-surface hover:border-outline font-body-md text-body-md transition-colors">

                        </button>
<button class="py-stack-sm rounded-lg border border-outline-variant bg-surface text-on-surface hover:border-outline font-body-md text-body-md transition-colors">
                            06:30 PM
                        </button>
</div>
</div>
</div>
</section>

<div class="w-full max-w-2xl">
<button class="w-full bg-primary text-on-primary font-headline-md text-[18px] py-4 rounded-xl shadow-[0_0_20px_rgba(242,202,80,0.15)] hover:bg-primary-fixed-dim transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                Confirm Booking

</button>
</div>
</footer>
