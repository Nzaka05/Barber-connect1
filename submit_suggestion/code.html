    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-20">
<!-- TopAppBar -->
<header class="bg-black/90 backdrop-blur-md shadow-[0_4px_30px_rgba(0,0,0,0.5)] border-b border-white/10 fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="text-white/70 hover:text-white hover:bg-white/5 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<h1 class="text-xl font-black text-yellow-500 tracking-tighter">ELITE GROOMING</h1>
<div class="flex items-center">
<button class="text-white/70 hover:text-white hover:bg-white/5 transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</div>
</header>
<main class="flex-grow px-container-margin py-stack-lg max-w-3xl mx-auto w-full">
<div class="mb-stack-lg">
<h2 class="font-headline-lg text-headline-lg text-on-background mb-stack-sm">Submit Suggestion</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Your feedback helps us improve the Elite Grooming experience for everyone.</p>
</div>
<form class="space-y-stack-md bg-surface-container-high rounded-xl p-6 shadow-xl border border-white/5 relative overflow-hidden">
<!-- Glassmorphism subtle accent -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Title -->
<div class="space-y-stack-sm relative z-10">
<label class="block font-label-sm text-label-sm text-on-surface" for="title">Title</label>
<input class="w-full bg-surface text-on-surface font-body-md text-body-md border border-outline-variant rounded-lg p-3 focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50" id="title" placeholder="E.g., New chair lighting" type="text"/>
</div>
<!-- Category -->
<div class="space-y-stack-sm relative z-10">
<label class="block font-label-sm text-label-sm text-on-surface" for="category">Category</label>
<div class="relative">
<select class="w-full bg-surface text-on-surface font-body-md text-body-md border border-outline-variant rounded-lg p-3 appearance-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="category">
<option class="text-on-surface-variant" disabled="" selected="" value="">Select a category</option>
<option value="equipment">Equipment &amp; Tools</option>
<option value="operations">Operations &amp; Workflow</option>
<option value="environment">Environment &amp; Atmosphere</option>
<option value="other">Other</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Body -->
<div class="space-y-stack-sm relative z-10">
<label class="block font-label-sm text-label-sm text-on-surface" for="suggestion">Suggestion Details</label>
<textarea class="w-full bg-surface text-on-surface font-body-md text-body-md border border-outline-variant rounded-lg p-3 focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50 resize-y" id="suggestion" placeholder="Describe your suggestion in detail..." rows="5"></textarea>
</div>
<!-- Anonymous Toggle -->
<div class="flex items-center justify-between py-stack-sm relative z-10 border-t border-outline-variant mt-stack-md pt-stack-md">
<div>
<span class="block font-label-sm text-label-sm text-on-surface">Submit Anonymously</span>
<span class="block font-body-sm text-sm text-on-surface-variant mt-1">Hide your name from management.</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-on-surface after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Submit Button -->
<div class="pt-stack-md relative z-10">
<button class="w-full bg-primary hover:bg-primary-fixed-dim text-on-primary font-label-sm text-label-sm rounded-lg py-4 transition-colors active:scale-95 duration-200 shadow-[0_4px_20px_rgba(242,202,80,0.2)]" type="submit">
                    Submit Suggestion
                </button>
</div>
</form>
</main>
</body></html>
